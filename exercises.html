<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Grind — Exercises</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="bg-glow"><span class="g1"></span><span class="g2"></span><span class="g3"></span></div>
<nav id="topnav"></nav>
<div class="app">
  <header class="page-in">
    <div class="eyebrow">Library</div>
    <h1>Exercises</h1>
    <p class="muted">Search, filter, and learn correct form.</p>
  </header>

  <div class="section stack">
    <div class="search glass">
      <span>🔍</span>
      <input id="q" type="text" placeholder="Search exercise, muscle, workout...">
    </div>
    <div class="chips" id="muscleChips"></div>
    <div class="chips" id="diffChips2"></div>
  </div>

  <div class="section stack" id="exList"></div>

  <footer class="credit">Daily Grind · <b>Created by Ayush Sharma</b></footer>
</div>
<div id="bottomnav"></div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
const muscles = ["All", ...new Set(EXERCISES.map(e=>e.muscle))];
const diffs = ["All","Beginner","Intermediate","Advanced"];
let activeMuscle="All", activeDiff="All", q="";

document.getElementById("muscleChips").innerHTML = muscles.map((m,i)=>`<div class="chip ${i===0?'active':''}" data-m="${m}">${m}</div>`).join("");
document.getElementById("diffChips2").innerHTML = diffs.map((d,i)=>`<div class="chip ${i===0?'active':''}" data-d="${d}">${d}</div>`).join("");

function renderList(){
  let list = EXERCISES.filter(e=>{
    const text = (e.name+" "+e.muscle+" "+e.equipment).toLowerCase();
    if(q && !text.includes(q.toLowerCase())) return false;
    if(activeMuscle!=="All" && e.muscle!==activeMuscle) return false;
    if(activeDiff!=="All" && e.difficulty!==activeDiff) return false;
    return true;
  });
  document.getElementById("exList").innerHTML = list.map(e=>`
    <div class="glass ex-card" data-id="${e.id}">
      <div class="top">
        <div><div class="name">${e.name}</div><div class="muscle">${e.muscle} · ${e.equipment}</div></div>
        <span class="pill">${e.difficulty}</span>
      </div>
      <div class="tags"><span class="pill accent">${e.sets}</span><span class="pill">Rest ${e.rest}</span></div>
      <div class="detail">
        <b>Form:</b> ${e.form}<br><br>
        <b>Common mistakes:</b> ${e.mistakes}
      </div>
    </div>
  `).join("") || `<div class="glass card-sm muted" style="font-size:13.5px;">No exercises found. Try a different search.</div>`;

  document.querySelectorAll(".ex-card").forEach(c=>{
    c.onclick = ()=> c.classList.toggle("open");
  });
}
document.getElementById("q").oninput = (e)=>{ q=e.target.value; renderList(); };
document.getElementById("muscleChips").addEventListener("click",(e)=>{
  const chip=e.target.closest(".chip"); if(!chip) return;
  document.querySelectorAll("#muscleChips .chip").forEach(c=>c.classList.remove("active"));
  chip.classList.add("active"); activeMuscle=chip.dataset.m; renderList();
});
document.getElementById("diffChips2").addEventListener("click",(e)=>{
  const chip=e.target.closest(".chip"); if(!chip) return;
  document.querySelectorAll("#diffChips2 .chip").forEach(c=>c.classList.remove("active"));
  chip.classList.add("active"); activeDiff=chip.dataset.d; renderList();
});
renderList();
</script>
</body>
</html>
